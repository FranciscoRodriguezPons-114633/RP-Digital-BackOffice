name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    name: Base de datos (migraciones + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Levantar Supabase local (solo la base)
        run: supabase db start
      - name: Correr pruebas de la base
        run: supabase test db

  edge-function:
    name: Edge Function (chequeo de tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Con su propio deno.json: si no, Deno ve el package.json de la raíz y busca las
      # dependencias en node_modules, que en este job no existe.
      - run: deno check --config supabase/functions/process-outbox/deno.json supabase/functions/process-outbox/index.ts
