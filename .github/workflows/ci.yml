name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: al ponerle la etiqueta e2e a un PR corren las pruebas punta a punta.
    types: [opened, synchronize, reopened, labeled]

jobs:
  app:
    name: App (lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  database:
    name: Base de datos (migraciones + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Levantar Supabase local (solo la base)
        run: supabase db start
      - name: Correr pruebas de la base
        run: supabase test db

  edge-function:
    name: Edge Function (chequeo de tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Con su propio deno.json: si no, Deno ve el package.json de la raíz y busca las
      # dependencias en node_modules, que en este job no existe.
      - run: deno check --config supabase/functions/process-outbox/deno.json supabase/functions/process-outbox/index.ts

  e2e:
    name: Punta a punta (Playwright)
    # Necesita Supabase completo (con Auth), que tarda: corre en main y en los PR con la etiqueta e2e.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    # Fijo en 24.04: Playwright 1.56 todavía no tiene navegadores para Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Levantar Supabase local con Auth, migraciones y seed
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      - name: Variables de la app
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Despliegue al entorno de prueba
    # Solo en main y con todo en verde. Primero la base y la función de correos; recién
    # después Vercel construye la app, así nunca corre contra una base vieja.
    needs: [app, database, edge-function, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prueba
    concurrency:
      group: deploy-prueba
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: ¿Está configurado el entorno?
        id: env
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "listo=si" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Faltan los secretos del entorno de prueba (docs/operacion.md): no se despliega."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.env.outputs.listo == 'si'
      - uses: supabase/setup-cli@v1
        if: steps.env.outputs.listo == 'si'
        with:
          version: 2.121.0
      - name: Migraciones
        if: steps.env.outputs.listo == 'si'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
      - name: Función de correos
        if: steps.env.outputs.listo == 'si'
        run: supabase functions deploy process-outbox --project-ref "$SUPABASE_PROJECT_REF"
      - name: App en Vercel
        if: steps.env.outputs.listo == 'si' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Vercel está construyendo la app."
